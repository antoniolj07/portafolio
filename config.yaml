    index: true
    follow: true
  openGraph:
    site_name: Jorge Antonio Pérez Ordóñez Portfolio
    images:
      - url: '/og-image.webp'
        width: 1200
        height: 628
        alt: 'Jorge Antonio Pérez Ordóñez - Software Engineer Portfolio'
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: es
  textDirection: ltr

apps:
  blog:
    isEnabled: true

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'system'
